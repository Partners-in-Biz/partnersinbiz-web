name: Release linked runtime for internal Windows staff

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing runtime version to publish on the isolated internal Windows channel
        required: true
        default: '1.1.22'

permissions:
  contents: write

concurrency:
  group: linked-runtime-windows-internal-release
  cancel-in-progress: false

jobs:
  build-windows-arm64-bun:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: npm ci
      - name: Cross-compile Windows arm64 Bun executables
        run: |
          mkdir -p runtime-installers/prebuilt/windows-arm64
          bun build --compile --target=bun-windows-arm64 runtime-installers/runtime/cli.ts --outfile runtime-installers/prebuilt/windows-arm64/pib-runtime.exe
          bun build --compile --target=bun-windows-arm64 runtime-installers/runtime/release-manager.ts --outfile runtime-installers/prebuilt/windows-arm64/pib-release-manager.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-internal-arm64-bun-${{ github.sha }}
          path: runtime-installers/prebuilt/windows-arm64
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build-windows-arm64-bun
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      PIB_RUNTIME_RELEASE_PRIVATE_KEY: ${{ secrets.LINKED_RUNTIME_RELEASE_PRIVATE_KEY }}
      INTERNAL_SIGNING_PFX_BASE64: ${{ secrets.PIB_WINDOWS_INTERNAL_SIGNING_PFX_BASE64 }}
      INTERNAL_SIGNING_PFX_PASSWORD: ${{ secrets.PIB_WINDOWS_INTERNAL_SIGNING_PFX_PASSWORD }}
      EXPECTED_PUBLISHER: The Partners in Business (PTY) LTD
      EXPECTED_CERT_SHA256: F40112CCB174A9FF5B7F56388D66BBA9CC98D9655C817B66B5F0A3D5A4DB7042
    steps:
      - name: Refuse non-production source
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Internal Windows releases must still build from production main.' }
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: windows-internal-arm64-bun-${{ github.sha }}
          path: runtime-installers/prebuilt/windows-arm64
      - run: npm ci
      - name: Verify release inputs and isolated channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Version must be SemVer.' }
          foreach ($Name in @('PIB_RUNTIME_RELEASE_PRIVATE_KEY','INTERNAL_SIGNING_PFX_BASE64','INTERNAL_SIGNING_PFX_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$Name").Value)) { throw "$Name is not configured." }
          }
          gh release view "runtime-v$env:VERSION" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Public runtime-v$env:VERSION must exist first." }
          $PreviousNativeErrorPreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view "runtime-internal-v$env:VERSION" 2>$null | Out-Null
          $InternalReleaseExitCode = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          $PSNativeCommandUseErrorActionPreference = $PreviousNativeErrorPreference
          if ($InternalReleaseExitCode -eq 0) { throw 'Immutable internal Windows release already exists.' }
      - name: Prepare and pin internal signing identity
        timeout-minutes: 2
        shell: pwsh
        run: |
          $Pfx = Join-Path $env:RUNNER_TEMP 'partnersinbiz-internal-signing.pfx'
          $Cer = Join-Path $env:RUNNER_TEMP 'partnersinbiz-internal-windows-signing.cer'
          [IO.File]::WriteAllBytes($Pfx, [Convert]::FromBase64String($env:INTERNAL_SIGNING_PFX_BASE64))
          [IO.File]::WriteAllBytes($Cer, [Convert]::FromBase64String((Get-Content runtime-installers/windows/internal-signing-public.cer.base64 -Raw).Trim()))
          $Flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $SigningCertificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($Pfx, $env:INTERNAL_SIGNING_PFX_PASSWORD, $Flags)
          $PublicCertificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($Cer)
          $Sha = [Security.Cryptography.SHA256]::HashData($PublicCertificate.RawData)
          $Fingerprint = ([BitConverter]::ToString($Sha)).Replace('-','')
          if ($Fingerprint -cne $env:EXPECTED_CERT_SHA256) { throw "Committed internal certificate fingerprint mismatch: $Fingerprint" }
          $SigningSha = [Security.Cryptography.SHA256]::HashData($SigningCertificate.RawData)
          $SigningFingerprint = ([BitConverter]::ToString($SigningSha)).Replace('-','')
          if (-not $SigningCertificate.HasPrivateKey -or $SigningFingerprint -cne $Fingerprint) { throw 'Internal signing PFX does not match the pinned public certificate.' }
          $Publisher = $PublicCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($Publisher -cne $env:EXPECTED_PUBLISHER) { throw "Unexpected internal publisher: $Publisher" }
          "PIB_INTERNAL_SIGNING_PFX=$Pfx" | Out-File $env:GITHUB_ENV -Append
          "PIB_INTERNAL_SIGNING_CERT=$Cer" | Out-File $env:GITHUB_ENV -Append
      - name: Locate bounded Windows signing tool
        timeout-minutes: 2
        shell: pwsh
        run: |
          $SignTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $SignTool) { throw 'signtool.exe was not found on the Windows release runner.' }
          "PIB_SIGNTOOL=$($SignTool.FullName)" | Out-File $env:GITHUB_ENV -Append
      - name: Build Windows x64 and arm64 runtimes
        shell: bash
        env:
          PIB_RUNTIME_TARGETS: windows-x64 windows-arm64
          PIB_RUNTIME_PREBUILT_WINDOWS_ARM64_DIR: runtime-installers/prebuilt/windows-arm64
        run: bash runtime-installers/build-runtime.sh
      - name: Sign internal Windows executable matrix
        shell: pwsh
        run: |
          foreach ($Arch in @('x64','arm64')) {
            foreach ($Name in @('pib-runtime.exe','pib-release-manager.exe','pib-credential-helper.exe','PartnersInBizRuntimeService.exe')) {
              $Path = "runtime-installers/dist/windows-$Arch/$Name"
              & $env:PIB_SIGNTOOL sign /f $env:PIB_INTERNAL_SIGNING_PFX /p $env:INTERNAL_SIGNING_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /d 'Partners in Biz linked runtime (internal staff)' $Path
              if ($LASTEXITCODE -ne 0) { throw "Internal Authenticode signing failed: $Path" }
            }
          }
      - name: Verify executable signatures and native helpers
        shell: pwsh
        run: |
          function Assert-InternalSignature([string]$Path) {
            $Signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($Signature.Status -notin @('Valid','NotTrusted') -or -not $Signature.SignerCertificate) { throw "Invalid internal Authenticode signature: $Path ($($Signature.Status))." }
            $Publisher = $Signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            $Sha = [Security.Cryptography.SHA256]::HashData($Signature.SignerCertificate.RawData)
            $Fingerprint = ([BitConverter]::ToString($Sha)).Replace('-','')
            if ($Publisher -cne $env:EXPECTED_PUBLISHER -or $Fingerprint -cne $env:EXPECTED_CERT_SHA256) { throw "Unexpected internal signer for $Path." }
          }
          foreach ($Arch in @('x64','arm64')) {
            foreach ($Name in @('pib-runtime.exe','pib-release-manager.exe','pib-credential-helper.exe','PartnersInBizRuntimeService.exe')) { Assert-InternalSignature "runtime-installers/dist/windows-$Arch/$Name" }
          }
          $Helper = Resolve-Path runtime-installers/dist/windows-x64/pib-credential-helper.exe
          'WINDOWS_INTERNAL_SIGNED_CREDENTIAL_SMOKE' | & $Helper put internal-release-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Credential Manager write failed.' }
          $Value = & $Helper get internal-release-smoke
          & $Helper clear internal-release-smoke
          if ($Value.Trim() -ne 'WINDOWS_INTERNAL_SIGNED_CREDENTIAL_SMOKE') { throw 'Credential Manager signed helper readback failed.' }
          npx tsx scripts/verify-linked-runtime-installers.ts
      - name: Create signed metadata and CAB containers
        shell: pwsh
        run: |
          $Minimum = ($env:VERSION -replace '^(\d+\.\d+)\.\d+.*$', '$1.0')
          npx tsx scripts/package-linked-runtime-release.ts --version $env:VERSION --minimum-version $Minimum --tag "runtime-internal-v$env:VERSION" --targets windows-x64,windows-arm64
          Copy-Item $env:PIB_INTERNAL_SIGNING_CERT runtime-installers/release-dist/partnersinbiz-internal-windows-signing.cer
      - name: Sign and verify internal CABs
        shell: pwsh
        run: |
          function Assert-InternalSignature([string]$Path) {
            $Signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($Signature.Status -notin @('Valid','NotTrusted') -or -not $Signature.SignerCertificate) { throw "Invalid internal Authenticode signature: $Path ($($Signature.Status))." }
            $Publisher = $Signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            $Sha = [Security.Cryptography.SHA256]::HashData($Signature.SignerCertificate.RawData)
            $Fingerprint = ([BitConverter]::ToString($Sha)).Replace('-','')
            if ($Publisher -cne $env:EXPECTED_PUBLISHER -or $Fingerprint -cne $env:EXPECTED_CERT_SHA256) { throw "Unexpected internal signer for $Path." }
          }
          foreach ($Arch in @('x64','arm64')) {
            $Prefix = "partnersinbiz-runtime-windows-$Arch"
            $Cab = "runtime-installers/release-dist/$Prefix-installer.cab"
            & $env:PIB_SIGNTOOL sign /f $env:PIB_INTERNAL_SIGNING_PFX /p $env:INTERNAL_SIGNING_PFX_PASSWORD /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /d 'Partners in Biz linked runtime installer (internal staff)' $Cab
            if ($LASTEXITCODE -ne 0) { throw "Internal CAB signing failed: $Cab" }
            Assert-InternalSignature $Cab
            $Expanded = Join-Path $env:RUNNER_TEMP "expanded-$Arch"
            New-Item -ItemType Directory $Expanded | Out-Null
            & expand.exe $Cab -F:* $Expanded | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "CAB extraction failed for $Arch." }
            foreach ($Name in @('pib-runtime.exe','pib-release-manager.exe','pib-credential-helper.exe','PartnersInBizRuntimeService.exe')) { Assert-InternalSignature (Join-Path $Expanded $Name) }
            [void][scriptblock]::Create((Get-Content (Join-Path $Expanded 'install.ps1') -Raw))
            & 'runtime-installers/dist/windows-x64/pib-release-manager.exe' verify --manifest "runtime-installers/release-dist/$Prefix-stable.json" --payload "runtime-installers/release-dist/$Prefix.exe" --signature "runtime-installers/release-dist/$Prefix-stable.json.sig" --public-key runtime-installers/release-public.pem --platform windows --architecture $Arch --current-version $env:VERSION --channel stable
            if ($LASTEXITCODE -ne 0) { throw "Release verification failed for $Arch." }
          }
      - name: Publish immutable internal Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "runtime-internal-v$env:VERSION" runtime-installers/release-dist/* --target "$env:GITHUB_SHA" --title "Partners in Biz linked runtime $env:VERSION (internal Windows staff)" --notes 'Internal staff-only Windows x64 and arm64 runtime. Requires explicit installation of the pinned PiB trust certificate. Not for public distribution.' --prerelease
