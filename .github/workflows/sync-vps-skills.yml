name: Sync VPS platform skills
# Runs from development so VPS agents consume the same branch they work on.
on:
  push:
    branches: [development]
    paths:
      - '.claude/skills/**'
      - 'config/agent-skill-policy.json'
      - 'scripts/apply-agent-skill-policy.mjs'
      - 'scripts/apply-vps-skill-staging.sh'
      - 'scripts/install-vps-skills.sh'
      - 'ops/hermes-vps/pib-skill-sync.sudoers'
      - '.github/workflows/sync-vps-skills.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: development

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rsync platform skills and policy tooling to VPS
        run: |
          local_helper_sha=$(sha256sum scripts/apply-vps-skill-staging.sh | awk '{print $1}')
          remote_helper_sha=$(ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sha256sum /usr/local/sbin/pib-apply-skill-staging" | awk '{print $1}')
          if [ "$local_helper_sha" != "$remote_helper_sha" ]; then
            echo "Root-owned VPS skill installer is not at the reviewed repository version" >&2
            exit 1
          fi

          staging="/srv/hermes-projects/pib-skill-staging/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "rm -rf '$staging' && mkdir -p '$staging/.claude/skills' '$staging/config' '$staging/scripts'"
          rsync -rlz --omit-dir-times --no-perms --no-owner --no-group \
            config/agent-skill-policy.json \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$staging/config/agent-skill-policy.json"
          rsync -rlz --omit-dir-times --no-perms --no-owner --no-group \
            scripts/apply-agent-skill-policy.mjs scripts/install-vps-skills.sh \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$staging/scripts/"

          # Stage as the unprivileged deployment user outside HERMES_HOME.
          # Hermes deliberately restores /var/lib/hermes to mode 0700, so the
          # old direct-rsync path was inherently racy. A fixed root-owned helper
          # validates and installs this data-only bundle through narrow sudo.
          mapfile -t sync_skills < <(node -e "const p=require('./config/agent-skill-policy.json'); console.log(Object.entries(p.skillCatalog).filter(([,v]) => v.syncTarget === 'vps').map(([k]) => k).sort().join('\n'))")
          for skill in "${sync_skills[@]}"; do
            if [ -d ".claude/skills/$skill" ]; then
              echo "-> rsyncing $skill"
              dest_dir="$staging/.claude/skills/$skill"
              ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "mkdir -p '$dest_dir'"
              rsync -rlz --delete --omit-dir-times --no-perms --no-owner --no-group \
                ".claude/skills/$skill/" \
                "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$dest_dir/"
            else
              echo "-- skipping $skill (not found in repo)"
            fi
          done
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo /usr/local/sbin/pib-apply-skill-staging '$staging'"
          echo "Sync complete"
